name: SAIF AI - Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saif-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: final
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

jobs:
  build:
    name: assembleStandardDebug
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('final/gradle/wrapper/gradle-wrapper.properties','final/gradle/libs.versions.toml','final/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept SDK licences + install platforms
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || \
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleStandardDebug --no-daemon --no-configuration-cache --stacktrace --continue 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarise compiler errors
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci
          {
            echo "### exit code: ${{ steps.build.outputs.exit_code }}"
            echo
            echo "#### Kotlin/Java errors (e: / error:)"
            grep -E "^(e|w): |error: " /tmp/build.log | grep -E "^(e): |error: " | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' | sort -u
            echo
            echo "#### Failed tasks / causes"
            grep -E "^> Task .*FAILED|^FAILURE|What went wrong|^Caused by|Execution failed for task|Could not (resolve|find|GET|download)|Plugin \[id" /tmp/build.log | sort -u | head -200
            echo
            echo "#### Tail"
            tail -120 /tmp/build.log
          } > ci/compile-report.txt
          grep -cE "^e: " /tmp/build.log > ci/error-count.txt 2>/dev/null || echo 0 > ci/error-count.txt
          echo "errors: $(cat ci/error-count.txt)"
          head -80 ci/compile-report.txt

      - name: Upload build log + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saif-build-log
          path: |
            ci/compile-report.txt
            /tmp/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SAIF-AI-apk
          path: final/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail job if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
