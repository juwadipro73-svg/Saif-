name: SAIF AI - Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saif-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: final
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: assembleStandardDebug
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('final/gradle/wrapper/gradle-wrapper.properties','final/gradle/libs.versions.toml','final/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set +e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null
          ls "$ANDROID_HOME/build-tools" 2>/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          ls "$ANDROID_HOME/platforms" 2>/dev/null
          exit 0

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleStandardDebug --no-daemon --no-configuration-cache --continue 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarise compiler errors
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci
          {
            echo "# CI compile report"
            echo
            echo "run: ${{ github.run_id }}  commit: ${{ github.sha }}  exit: ${{ steps.build.outputs.exit_code }}"
            echo
            echo "## errors by file (unique)"
            grep -E "^e: " /tmp/build.log | sed 's|^e: file:///home/runner/work/[^/]*/[^/]*/||' | sort -u
            echo
            echo "## javac / aapt errors"
            grep -E "error: " /tmp/build.log | sort -u | head -300
            echo
            echo "## failed tasks, causes, resolution problems"
            grep -E "^> Task .*FAILED|^FAILURE|What went wrong|^Caused by|Execution failed for task|Could not (resolve|find|GET|download)|Plugin \[id|^> Could not" /tmp/build.log | sort -u | head -120
            echo
            echo "## tail"
            tail -150 /tmp/build.log
          } > ci/compile-report.txt
          echo "$(grep -cE '^e: ' /tmp/build.log)" > ci/error-count.txt
          echo "kotlin errors: $(cat ci/error-count.txt)"
          head -60 ci/compile-report.txt

      - name: Publish APK into branch (delivery path)
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p ci
          cp "$apk" ci/SAIF-AI-debug.apk
          ls -lh ci/SAIF-AI-debug.apk
          md5sum ci/SAIF-AI-debug.apk > ci/SAIF-AI-debug.apk.md5

      - name: Commit report and APK back to the branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "saif-ci"
          git config user.email "ci@saif.ai"
          git add -f ci/ || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "ci: build report ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail job if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
